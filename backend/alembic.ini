[alembic]
# NOTE: keep this file ASCII-only; Windows configparser reads it with the
# system locale codec (GBK on zh-CN), so UTF-8 comments break parsing.
script_location = alembic
prepend_sys_path = .
# Real URL is read from app.core.config (.env) inside env.py; placeholder here.
sqlalchemy.url = postgresql+asyncpg://evocode:evocode@localhost:5432/evocode

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
